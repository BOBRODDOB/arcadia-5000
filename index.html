<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcadia-5000: 2D Plane RPG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff41;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .game-wrapper {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }

        #gameCanvas {
            border: 2px solid #00ff41;
            background: linear-gradient(to bottom, #1a2a4e 0%, #0d1628 100%);
            image-rendering: pixelated;
            flex: 1;
            min-width: 400px;
        }

        .ui-panel {
            width: 280px;
            background: rgba(10, 14, 39, 0.95);
            border: 2px solid #00ff41;
            border-radius: 5px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            font-size: 0.9em;
        }

        .panel-title {
            color: #00ff41;
            font-size: 1.1em;
            text-decoration: underline;
            margin-bottom: 8px;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            color: #0088ff;
        }

        .stat-value {
            color: #00ff41;
            font-weight: bold;
        }

        .health-bar {
            width: 100%;
            height: 20px;
            background: #001a33;
            border: 1px solid #00ff41;
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff41, #00aa00);
            width: 100%;
            transition: width 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            color: #000;
            font-weight: bold;
        }

        .log-area {
            background: rgba(0, 20, 50, 0.8);
            border: 1px solid #0088ff;
            padding: 10px;
            border-radius: 3px;
            height: 200px;
            overflow-y: auto;
            font-size: 0.85em;
            line-height: 1.4;
        }

        .log-entry {
            margin: 3px 0;
            padding: 2px 0;
            border-left: 2px solid #0088ff;
            padding-left: 6px;
        }

        .log-entry.encounter {
            color: #ffaa00;
            border-left-color: #ffaa00;
        }

        .log-entry.battle {
            color: #ff6b6b;
            border-left-color: #ff6b6b;
        }

        .log-entry.good {
            color: #00ff41;
            border-left-color: #00ff41;
        }

        .log-entry.info {
            color: #0088ff;
        }

        .controls {
            background: rgba(0, 50, 100, 0.3);
            border: 1px solid #0088ff;
            padding: 10px;
            border-radius: 3px;
            font-size: 0.85em;
        }

        .control-item {
            margin: 4px 0;
            color: #00ff41;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .action-btn {
            background: rgba(0, 136, 255, 0.3);
            border: 1px solid #0088ff;
            color: #0088ff;
            padding: 6px;
            cursor: pointer;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            transition: all 0.2s;
            font-size: 0.9em;
        }

        .action-btn:hover:not(:disabled) {
            background: rgba(0, 136, 255, 0.6);
            box-shadow: 0 0 8px #0088ff;
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .screen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        .screen-overlay.show {
            display: flex;
        }

        .battle-screen {
            background: rgba(10, 14, 39, 0.98);
            border: 3px solid #ff0000;
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            text-align: center;
            color: #00ff41;
        }

        .battle-screen h2 {
            font-size: 2em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff0000;
        }

        .battle-opponent {
            background: rgba(100, 0, 0, 0.3);
            border: 1px solid #ff0000;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
        }

        .battle-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .battle-btn {
            background: rgba(255, 100, 0, 0.3);
            border: 2px solid #ff0000;
            color: #ff0000;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
        }

        .battle-btn:hover {
            background: rgba(255, 100, 0, 0.6);
            box-shadow: 0 0 10px #ff0000;
        }

        .battle-btn.flee {
            background: rgba(100, 100, 255, 0.3);
            border-color: #0088ff;
            color: #0088ff;
        }

        .battle-btn.flee:hover {
            background: rgba(100, 100, 255, 0.6);
            box-shadow: 0 0 10px #0088ff;
        }

        @media (max-width: 900px) {
            .game-wrapper {
                flex-direction: column;
            }

            .ui-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-panel">
            <div>
                <div class="panel-title">👤 PLAYER</div>
                <div class="stat-line">
                    <span>Level:</span>
                    <span class="stat-value" id="playerLevel">1</span>
                </div>
                <div class="stat-line">
                    <span>Health:</span>
                    <span class="stat-value" id="playerHealth">100/100</span>
                </div>
                <div class="health-bar">
                    <div class="health-fill" id="playerHealthBar" style="width: 100%;">100%</div>
                </div>
                <div class="stat-line">
                    <span>Attack:</span>
                    <span class="stat-value" id="playerAtk">10</span>
                </div>
                <div class="stat-line">
                    <span>Defense:</span>
                    <span class="stat-value" id="playerDef">5</span>
                </div>
                <div class="stat-line">
                    <span>Gold:</span>
                    <span class="stat-value" id="playerGold">0</span>
                </div>
                <div class="stat-line">
                    <span>Enemies:</span>
                    <span class="stat-value" id="enemiesDefeated">0</span>
                </div>
            </div>

            <div>
                <div class="panel-title">⚔️ CONTROLS</div>
                <div class="controls">
                    <div class="control-item">WASD - Move</div>
                    <div class="control-item">SPACE - Interact</div>
                    <div class="control-item">Red circle - Enemies</div>
                    <div class="control-item">Blue circle - You</div>
                    <div class="button-group">
                        <button class="action-btn" onclick="spawnEnemy()">Spawn Enemy</button>
                        <button class="action-btn" onclick="resetWorld()">Reset World</button>
                    </div>
                </div>
            </div>

            <div>
                <div class="panel-title">📜 BATTLE LOG</div>
                <div class="log-area" id="battleLog"></div>
            </div>
        </div>
    </div>

    <div class="screen-overlay" id="battleOverlay">
        <div class="battle-screen" id="battleScreen">
            <h2>⚔️ BATTLE ⚔️</h2>
            <div id="battleInfo"></div>
            <div class="battle-buttons">
                <button class="battle-btn" onclick="battleAction('attack')">ATTACK</button>
                <button class="battle-btn" onclick="battleAction('defend')">DEFEND</button>
                <button class="battle-btn flee" onclick="battleAction('flee')">FLEE</button>
            </div>
        </div>
    </div>

    <script src="world.js"></script>
</body>
</html>
